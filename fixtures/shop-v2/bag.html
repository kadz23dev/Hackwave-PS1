<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your bag</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; display: flex; gap: 2rem; }
    nav { width: 180px; border-right: 1px solid #ccc; padding-right: 1rem; }
    main { flex: 1; }
    ul { list-style: none; padding: 0; }
    li { margin: 0.5rem 0; }
    .total { font-weight: bold; margin: 1rem 0; font-size: 1.2rem; }
    button { cursor: pointer; padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <nav>
    <button aria-label="Shopping bag" onclick="location.href='/bag'">🛍 <span class="count" id="bag-count">0</span></button>
  </nav>
  <main>
    <h1>Your bag</h1>
    <div style="margin-bottom: 1.5rem;">
      <button class="btn-primary" onclick="location.href='/checkout/details'">Proceed to payment</button>
    </div>
    <ul id="bag-items"></ul>
    <div class="total" id="bag-total">Total: $0.00</div>
  </main>
  <script>
    async function loadBag() {
      const res = await fetch('/api/cart');
      const data = await res.json();
      const count = data.items ? data.items.length : 0;
      document.getElementById('bag-count').textContent = count;

      const list = document.getElementById('bag-items');
      list.innerHTML = '';
      (data.items || []).forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.name} - $${(item.priceCents / 100).toFixed(2)}`;
        list.appendChild(li);
      });
      document.getElementById('bag-total').textContent = `Total: $${((data.totalCents || 0) / 100).toFixed(2)}`;
    }
    loadBag();
  </script>
</body>
</html>
