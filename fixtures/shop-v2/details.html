<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery details</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-border: #1f293d;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --accent: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --radius-sm: 8px;
      --radius-md: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
    }
    .brand-logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .brand-title { font-size: 1.25rem; font-weight: 700; }
    .nav-back { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    .wrap {
      max-width: 540px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      width: 100%;
      flex: 1;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }
    .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }
    .form-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    form#details-form {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input {
      background: #0d121f;
      border: 1px solid var(--surface-border);
      color: #ffffff;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    button[type="submit"] {
      margin-top: 1rem;
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      border: none;
      padding: 1rem;
      border-radius: var(--radius-sm);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 16px var(--primary-glow);
      transition: all 0.2s ease;
    }
    button[type="submit"]:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-2px);
    }
    footer {
      margin-top: auto;
      border-top: 1px solid var(--surface-border);
      padding: 1.5rem 2rem;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand-wrap">
      <div class="brand-logo-icon">✨</div>
      <div class="brand-title">Gizmo Shop v2</div>
    </a>
    <a href="/bag" class="nav-back">← Back to Bag</a>
  </header>

  <main class="wrap">
    <h1>Delivery details</h1>
    <p class="subtitle">Step 1 of 2 · Enter shipping destination</p>

    <div class="form-card">
      <form id="details-form" onsubmit="handleDetails(event)">
        <div class="form-group">
          <label for="user-email">Email address</label>
          <input id="user-email" type="email" required placeholder="alice@example.com">
        </div>
        <div class="form-group">
          <label for="fullname">Name</label>
          <input id="fullname" type="text" required placeholder="Alice Tester">
        </div>
        <div class="form-group">
          <label for="ship-addr">Shipping address</label>
          <input id="ship-addr" type="text" required placeholder="12 Test Street, Pune">
        </div>
        <button type="submit">Continue</button>
      </form>
    </div>
  </main>

  <footer>
    <p>Gizmo Shop (Version B Redesign) · Kaizen AI Autonomous Self-Healing Pipeline Testbed</p>
  </footer>

  <script>
    function handleDetails(e) {
      e.preventDefault();
      sessionStorage.setItem('email', document.getElementById('user-email').value);
      sessionStorage.setItem('name', document.getElementById('fullname').value);
      sessionStorage.setItem('address', document.getElementById('ship-addr').value);
      location.href = '/checkout/payment';
    }
  </script>
</body>
</html>
