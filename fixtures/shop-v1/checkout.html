<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-border: #1f293d;
      --surface-hover: #172238;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --accent: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
    }
    .brand-logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .nav-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .checkout-wrap {
      max-width: 580px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      width: 100%;
      flex: 1;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }
    .checkout-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .form-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    form#checkout-form {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input {
      background: #0d121f;
      border: 1px solid var(--surface-border);
      color: #ffffff;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    button#pay-button {
      margin-top: 1rem;
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      padding: 1rem;
      border-radius: var(--radius-sm);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
    }
    button#pay-button:hover {
      background: linear-gradient(135deg, #059669, #047857);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
      transform: translateY(-2px);
    }
    button#pay-button:active {
      transform: scale(0.99);
    }
    [role="alert"] {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      margin-top: 1rem;
      font-weight: 600;
      text-align: center;
    }
    footer {
      margin-top: auto;
      border-top: 1px solid var(--surface-border);
      padding: 1.5rem 2rem;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand-wrap">
      <div class="brand-logo-icon">⚡</div>
      <div class="brand-title">Gizmo Shop</div>
    </a>
    <a href="/cart" class="nav-back">← Back to Cart</a>
  </header>

  <main class="checkout-wrap">
    <h1>Checkout</h1>
    <p class="checkout-desc">Enter customer and payment details to complete your order.</p>

    <div class="form-card">
      <form id="checkout-form" onsubmit="handlePay(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="alice@example.com">
        </div>
        <div class="form-group">
          <label for="name">Full name</label>
          <input id="name" type="text" required placeholder="Alice Tester">
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <input id="address" type="text" required placeholder="12 Test Street, Pune">
        </div>
        <div class="form-group">
          <label for="card-number">Card number</label>
          <input id="card-number" type="text" required placeholder="4242 4242 4242 4242">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="expiry">Expiry (MM/YY)</label>
            <input id="expiry" type="text" required placeholder="12/30">
          </div>
          <div class="form-group">
            <label for="cvc">CVC</label>
            <input id="cvc" type="text" required placeholder="123">
          </div>
        </div>
        <button id="pay-button" type="submit">Pay now</button>
      </form>
      <div id="alert-container"></div>
    </div>
  </main>

  <footer>
    <p>Gizmo Shop (Version A) · Kaizen AI Autonomous Self-Healing Pipeline Testbed</p>
  </footer>

  <script>
    async function handlePay(e) {
      e.preventDefault();
      const payload = {
        email: document.getElementById('email').value,
        name: document.getElementById('name').value,
        address: document.getElementById('address').value,
        cardNumber: document.getElementById('card-number').value,
        expiry: document.getElementById('expiry').value,
        cvc: document.getElementById('cvc').value,
      };
      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.status === 201) {
          const data = await res.json();
          location.href = `/confirmation?order=${data.orderId}`;
        } else {
          document.getElementById('alert-container').innerHTML = '<p role="alert">Payment failed</p>';
        }
      } catch {
        document.getElementById('alert-container').innerHTML = '<p role="alert">Payment failed</p>';
      }
    }
  </script>
</body>
</html>
