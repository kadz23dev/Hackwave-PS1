<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your cart</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-border: #1f293d;
      --surface-hover: #172238;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --accent: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
    }
    .brand-logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .nav-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--primary); }
    .cart-container {
      max-width: 900px;
      margin: 2.5rem auto;
      padding: 0 2rem;
      width: 100%;
      flex: 1;
    }
    .cart-header {
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }
    .cart-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .cart-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    ul#cart-items {
      list-style: none;
      padding: 0;
      margin-bottom: 1.75rem;
    }
    ul#cart-items li {
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      font-weight: 500;
    }
    ul#cart-items li:last-child {
      border-bottom: none;
    }
    .empty-cart-msg {
      color: var(--text-dim);
      font-style: italic;
      padding: 1.5rem 0;
      text-align: center;
    }
    .total-divider {
      border-top: 2px solid var(--surface-border);
      padding-top: 1.25rem;
      margin-top: 1rem;
    }
    .total {
      font-size: 1.4rem;
      font-weight: 800;
      color: #10b981;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.5rem;
    }
    .checkout-btn-wrap {
      margin-top: 1rem;
    }
    button#checkout-button {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #ffffff;
      border: none;
      padding: 1rem 1.5rem;
      border-radius: var(--radius-sm);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 16px var(--primary-glow);
      transition: all 0.2s ease;
    }
    button#checkout-button:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 6px 22px rgba(59, 130, 246, 0.45);
      transform: translateY(-2px);
    }
    button#checkout-button:active {
      transform: scale(0.99);
    }
    .trust-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-top: 1.5rem;
      color: var(--text-dim);
      font-size: 0.8rem;
    }
    footer {
      margin-top: auto;
      border-top: 1px solid var(--surface-border);
      padding: 1.5rem 2rem;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand-wrap">
      <div class="brand-logo-icon">⚡</div>
      <div class="brand-title">Gizmo Shop</div>
    </a>
    <a href="/" class="nav-back">← Continue Shopping</a>
  </header>

  <main class="cart-container">
    <div class="cart-header">
      <h1>Your cart</h1>
      <p class="cart-subtitle">Review selected items before proceeding to secure payment.</p>
    </div>

    <div class="cart-card">
      <ul id="cart-items">
        <li class="empty-cart-msg">Loading cart items...</li>
      </ul>

      <div class="total-divider">
        <div class="total" id="cart-total">Total: $0.00</div>
      </div>

      <div class="checkout-btn-wrap">
        <button id="checkout-button" onclick="location.href='/checkout'">Checkout</button>
      </div>

      <div class="trust-footer">
        <span>🔒 256-Bit SSL Encryption</span>
        <span>⚡ Instant Order Dispatch</span>
        <span>✓ 30-Day Money Back</span>
      </div>
    </div>
  </main>

  <footer>
    <p>Gizmo Shop (Version A) · Kaizen AI Autonomous Self-Healing Pipeline Testbed</p>
  </footer>

  <script>
    async function loadCart() {
      try {
        const res = await fetch('/api/cart');
        const data = await res.json();
        const list = document.getElementById('cart-items');
        list.innerHTML = '';
        if (!data.items || data.items.length === 0) {
          list.innerHTML = '<li class="empty-cart-msg">Your cart is currently empty.</li>';
        } else {
          data.items.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<span><strong>${item.name}</strong></span> <span>$${(item.priceCents / 100).toFixed(2)}</span>`;
            list.appendChild(li);
          });
        }
        document.getElementById('cart-total').textContent = `Total: $${((data.totalCents || 0) / 100).toFixed(2)}`;
      } catch (err) {}
    }
    loadCart();
  </script>
</body>
</html>
