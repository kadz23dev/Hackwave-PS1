name: HealTest CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          else
            echo "package.json not yet created (pre-scaffold Phase 0). Skipping install."
          fi

      - name: Install Playwright Chromium
        run: |
          if [ -f package.json ]; then
            npx playwright install --with-deps chromium
          else
            echo "Skipping Playwright installation (pre-scaffold Phase 0)."
          fi

      - name: Run Test Suite (Vitest)
        run: |
          if [ -f package.json ]; then
            npm test
          else
            echo "Skipping tests: package.json will be created in Task T01/B02."
          fi

      - name: Run Dashboard Token Linter (if present)
        run: |
          if [ -f scripts/check-dashboard.mjs ]; then
            node scripts/check-dashboard.mjs
          fi

      - name: Run Traceability Validator (if present)
        run: |
          if [ -f scripts/check-trace.mjs ]; then
            node scripts/check-trace.mjs
          fi
